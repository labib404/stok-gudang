<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stok Gudang Pro — Demo</title>
<meta name="description" content="Aplikasi stok barang & gudang offline: barang masuk/keluar, multi-gudang, stock opname, barcode, laporan laba. Tanpa langganan.">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Stok Gudang Pro v2.0.0. Lisensi untuk 1 usaha. Dilarang menjual ulang / membagikan. -->
<style>:root{
--bg:#f5f6f8; --bg2:#eef0f4; --panel:#ffffff; --ink:#141a24; --ink2:#3b4556; --muted:#6b7586;
--line:#e3e6ec; --line2:#d3d8e0;
--brand:#1f3a5f; --brand-ink:#fff; --accent:#f08c00; --accent-soft:#fff4e0;
--ok:#2f9e44; --ok-soft:#ebfbee; --warn:#e8590c; --warn-soft:#fff4e6; --bad:#e03131; --bad-soft:#fff5f5;
--info:#1971c2; --info-soft:#e7f5ff;
--radius:12px; --radius-sm:8px;
--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
--shadow-lg:0 12px 32px rgba(16,24,40,.18);
--mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
--sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--side:232px;
color-scheme:light;
}
html[data-theme="dark"]{
--bg:#0f1319; --bg2:#151a22; --panel:#181e27; --ink:#e9edf3; --ink2:#c2cad6; --muted:#8a94a5;
--line:#262e3a; --line2:#323c4b;
--brand:#8fb3e0; --brand-ink:#0f1319; --accent:#ffa94d; --accent-soft:#3a2a12;
--ok:#51cf66; --ok-soft:#12291a; --warn:#ff922b; --warn-soft:#33210f; --bad:#ff6b6b; --bad-soft:#341717;
--info:#4dabf7; --info-soft:#0f2638;
--shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 32px rgba(0,0,0,.5);
color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.5 var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--info)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.02em;flex:none}
.brand b{display:block;font-size:15px;line-height:1.2;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);color:var(--ink2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--bg2)}
.nav a.active{background:var(--brand);color:var(--brand-ink)}
.nav a .ic{width:18px;height:18px;flex:none}
.nav a .count{margin-left:auto;background:var(--warn);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:0 7px;line-height:18px}
.nav .sep{height:1px;background:var(--line);margin:10px 6px}
.side .foot{margin-top:auto;padding:10px 8px 0;color:var(--muted);font-size:12px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:12px;min-height:64px}
.topbar h1{font-size:19px;margin:0;letter-spacing:-.015em}
.topbar .sub{color:var(--muted);font-size:13px}
.topbar .grow{flex:1}
.content{padding:24px 28px 80px;max-width:1320px;width:100%}
.mtab{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:14px;font-weight:650}
.card-h .grow{flex:1}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi .lbl{color:var(--muted);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .hint{color:var(--muted);font-size:12px;margin-top:2px}
.kpi.warn .val{color:var(--warn)}
.kpi.bad .val{color:var(--bad)}
.kpi .dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}
.kpi.warn .dot{background:var(--warn)} .kpi.bad .dot{background:var(--bad)} .kpi.ok .dot{background:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:var(--panel);border-radius:var(--radius-sm);padding:8px 13px;cursor:pointer;font-weight:550;white-space:nowrap;line-height:1.2;transition:background .12s,border-color .12s}
.btn:hover{background:var(--bg2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#1b1205}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--bg2)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.icon{padding:7px}
.btn .ic{width:16px;height:16px}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:12.5px;font-weight:550;color:var(--ink2)}
.field .help{font-size:12px;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line2);background:var(--panel);border-radius:var(--radius-sm);padding:9px 11px;outline:none;transition:border-color .12s,box-shadow .12s;min-width:0}
textarea.input{resize:vertical;min-height:70px}
.input:focus{border-color:var(--info);box-shadow:0 0 0 3px color-mix(in srgb,var(--info) 18%,transparent)}
.input.num{font-variant-numeric:tabular-nums}
.input-wrap{position:relative}
.input-wrap .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.input-wrap .input{padding-left:34px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .search{flex:1;min-width:220px}
.toolbar select.input{width:auto}
.seg{display:inline-flex;background:var(--bg2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:550;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.tbl-wrap{overflow:auto;border-radius:0 0 var(--radius) var(--radius)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{position:sticky;top:0;background:var(--bg2);text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.tbl th.sortable{cursor:pointer}
.tbl th.sortable:hover{color:var(--ink)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--bg2) 55%,transparent)}
.tbl .r{text-align:right}
.tbl .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tbl .c{text-align:center}
.tbl .act{white-space:nowrap;text-align:right}
.tbl tfoot td{font-weight:700;background:var(--bg2)}
.cell-main{font-weight:600}
.cell-sub{color:var(--muted);font-size:12px}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:2px 9px;border-radius:99px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.info{background:var(--info-soft);color:var(--info)}
.badge.plain{background:var(--bg2);color:var(--ink2)}
.badge.plain::before{display:none}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .ic{width:40px;height:40px;opacity:.5;margin-bottom:8px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.list{display:flex;flex-direction:column}
.list .row{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line)}
.list .row:last-child{border-bottom:0}
.list .row .grow{flex:1;min-width:0}
.list .row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
.tx-ic .ic{width:16px;height:16px}
.tx-ic.in{background:var(--ok-soft);color:var(--ok)}
.tx-ic.out{background:var(--warn-soft);color:var(--warn)}
.tx-ic.adj{background:var(--info-soft);color:var(--info)}
.tx-ic.transfer{background:var(--bg2);color:var(--ink2)}
.bar{height:6px;border-radius:99px;background:var(--bg2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,22,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto;animation:fade .15s}
.modal{background:var(--panel);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;animation:pop .18s}
.modal.wide{max-width:860px}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 22px 6px}
.modal-h h2{margin:0;font-size:17px;flex:1;letter-spacing:-.01em}
.modal-b{padding:12px 22px 6px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:16px 22px 20px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(8px) scale(.985);opacity:0}}
.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:550;box-shadow:var(--shadow-lg);animation:pop .18s;max-width:90vw}
.toast.warn{background:var(--warn);color:#fff}
.toast.bad{background:var(--bad);color:#fff}
.toast.ok{background:var(--ok);color:#fff}
.picker{position:relative}
.picker-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow-lg);max-height:280px;overflow:auto;z-index:20}
.picker-list button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;border:0;background:none;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.picker-list button:last-child{border-bottom:0}
.picker-list button:hover,.picker-list button.hl{background:var(--bg2)}
.picked{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--bg2)}
.picked .grow{flex:1;min-width:0}
.lines .line{display:grid;grid-template-columns:minmax(0,1fr) 110px 130px 36px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.lines .line:last-child{border-bottom:0}
.callout{display:flex;gap:10px;padding:12px 14px;border-radius:10px;background:var(--info-soft);color:var(--ink2);font-size:13px}
.callout.warn{background:var(--warn-soft)}
.callout .ic{width:18px;height:18px;flex:none;color:var(--info);margin-top:1px}
.callout.warn .ic{color:var(--warn)}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.scanner video{width:100%;border-radius:12px;background:#000;aspect-ratio:4/3;object-fit:cover}
.scanner .frame{position:relative}
.scanner .frame::after{content:"";position:absolute;left:12%;right:12%;top:40%;bottom:40%;border:2px solid var(--accent);border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.25)}
.labels-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;max-height:340px;overflow:auto;padding:4px}
.label{border:1px dashed var(--line2);border-radius:6px;padding:8px;text-align:center;background:#fff;color:#000}
.label .ln{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label .lp{font-size:12px;font-weight:800}
.label svg{width:100%;height:44px}
.label .lc{font-family:var(--mono);font-size:10px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:550}
.stack{display:flex;flex-direction:column;gap:16px}
.row-flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.section-title{font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px}
.danger-zone{border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.welcome{background:linear-gradient(120deg,var(--brand),color-mix(in srgb,var(--brand) 70%,var(--accent)));color:var(--brand-ink);border:0}
.welcome h2{margin:0 0 4px;font-size:20px}
.welcome p{margin:0;opacity:.85}
.welcome .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:inherit}
.welcome .btn.accent{background:var(--accent);border-color:var(--accent);color:#1b1205}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-dash{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
.app{grid-template-columns:1fr}
.side{display:none}
.topbar{padding:12px 16px;min-height:56px}
.topbar h1{font-size:17px}
.topbar .sub{display:none}
.content{padding:16px 14px 96px}
.g2,.g3{grid-template-columns:minmax(0,1fr)}
.app{grid-template-columns:minmax(0,1fr)}
.form-grid{grid-template-columns:minmax(0,1fr)}
.mtab{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.mtab a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);text-decoration:none;padding:4px 0;font-weight:600}
.mtab a.active{color:var(--brand)}
.mtab a .ic{width:21px;height:21px}
.hide-m{display:none!important}
.modal-bg{padding:0;align-items:flex-end}
.modal{border-radius:18px 18px 0 0;max-height:94vh;overflow:auto}
.lines .line{grid-template-columns:1fr 90px 36px}
.lines .line .price{display:none}
.kv{grid-template-columns:110px 1fr}
}
@media (max-width:520px){.g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.kpi .val{font-size:20px}.btn .lbl-m{display:none}}
#print{display:none}
@media print{
body{background:#fff;color:#000}
.app,.modal-bg,.toast-wrap,.mtab{display:none!important}
#print{display:block!important}
#print .label{border:1px dashed #bbb;break-inside:avoid}
#print table{width:100%;border-collapse:collapse;font-size:11px}
#print th,#print td{border:1px solid #ccc;padding:4px 6px;text-align:left}
#print .num{text-align:right}
#print h1{font-size:16px;margin:0 0 2px} #print .meta{font-size:11px;color:#555;margin-bottom:10px}
@page{margin:12mm}
}
</style>
